name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx tsc --noEmit
      - run: npm test

  client:
    name: Client — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # `npm run lint` isn't gated here yet: three pages currently trip the
      # react-hooks/set-state-in-effect rule because of the fetch-on-mount
      # pattern used throughout the client (see FIXFLOW_AUDIT.md, "TanStack
      # Query is installed and completely unused"). That data-fetching
      # rewrite is scoped to a later phase — re-add this step once it lands.
